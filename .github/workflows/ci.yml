name: ESP32 CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        
    - name: Cache PlatformIO packages
      uses: actions/cache@v3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-platformio-
          
    - name: Build project
      run: |
        platformio run -e esp32doit-devkit-v1
        
    - name: Run native tests
      run: |
        platformio test -e test_desktop

  test-hardware-emulation:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        
    - name: Cache PlatformIO packages
      uses: actions/cache@v3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-test-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-platformio-test-
          
    - name: Build tests
      run: |
        platformio test -e test --without-uploading
        
    - name: Archive test build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: test-firmware
        path: .pio/build/test
        
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cppcheck cpplint
        
    - name: Run cppcheck
      run: |
        cppcheck --enable=all --inline-suppr --suppress=missingIncludeSystem --error-exitcode=1 src/ include/
        
    - name: Run cpplint
      run: |
        cpplint --filter=-legal/copyright,-whitespace/line_length,-readability/casting,-build/include_subdir src/*.cpp include/*.h
