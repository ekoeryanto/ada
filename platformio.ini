; ===============================================
; LIBRARIES - Core dependencies for 0x3 template
; ===============================================
lib_deps = 
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    bblanchon/ArduinoJson@^6.21.3
    AsyncTCP
    ESPAsyncWebServer
    ayushsharma82/ElegantOTA@^3.1.5
    Update
    Ticker
    adafruit/RTClib@^2.1.1
    adafruit/Adafruit ADS1X15@^2.4.0
    adafruit/Adafruit BusIO@^1.14.1
    marian-craciunescu/ESP32Ping@^1.7
    arduino-libraries/NTPClient@^3.2.1
    SPI
    SD
    ArduinoOTA
    4-20ma/ModbusMaster@^2.0.1

; ===============================================
; BUILD CONFIGURATION
; ===============================================
build_flags = 
    -D DEBUG_ESP_PORT=Serial
    -D CORE_DEBUG_LEVEL=3
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -O0
    -g
    -ggdb

; ===============================================
; UPLOAD CONFIGURATION
; ===============================================
; USB upload (default - use for first upload)
; upload_protocol = esptool
; upload_speed = 115200

; OTA upload - Enable after first USB upload
; upload_protocol = espota
; upload_port = 192.168.111.34
; Note: upload_flags now configured in environment section above

; ===============================================
; MONITORING CONFIGURATION
; ===============================================
monitor_filters = 
    esp32_exception_decoder
    time

; ===============================================
; DEBUGGING CONFIGURATION (optional)
; ===============================================
; debug_tool = esp-prog
; debug_init_break = tbreak setup
; debug_build_flags = -O0 -g -ggdb

; ===============================================
; ESP32-SPECIFIC CONFIGURATION
; ===============================================
; Partition scheme options:
; - default (1.2MB app, 1.5MB SPIFFS)
; - minimal (1.3MB app, 700KB SPIFFS)
; - no_ota (2MB app, 2MB SPIFFS)
; - huge_app (3MB app, 1MB SPIFFS)
board_build.partitions = huge_app.csv

