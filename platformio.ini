; PlatformIO Project Configuration File
;
; ESP32 Universal Template by 0x3
; Easy to adapt for any ESP32 board and project
;
; To use this template:
; 1. Change PROJECT_NAME, PROJECT_VERSION, PROJECT_AUTHOR in include/config.h
; 2. Update board type below if needed
; 3. Modify lib_deps if you need additional libraries
; 4. Update upload settings for your target board

; ===============================================
; BOARD CONFIGURATION - Change as needed
; ===============================================
; Supported ESP32 boards:
; - esp32doit-devkit-v1 (ESP32 DevKit V1 - most common)
; - esp32dev (Generic ESP32)
; - nodemcu-32s (NodeMCU-32S)
; - lolin_d32 (Wemos LOLIN D32)
; - lolin_d32_pro (Wemos LOLIN D32 Pro)
; - esp32-s2-saola-1 (ESP32-S2)
; - esp32-s3-devkitc-1 (ESP32-S3)
; - esp32-c3-devkitm-1 (ESP32-C3)

; ===============================================
; ESP32-SPECIFIC CONFIGURATION
; ===============================================
; Partition scheme options:
; - default (1.2MB app, 1.5MB SPIFFS) - supports OTA
; - minimal (1.3MB app, 700KB SPIFFS) - supports OTA
; - no_ota (2MB app, 2MB SPIFFS) - NO OTA support
; - huge_app (3MB app, 1MB SPIFFS) - NO OTA support
; - default_16MB (6.25MB app, 9.5MB SPIFFS) - for 16MB flash, supports OTA

[platformio]
default_envs = usb

[env]
; ===============================================
; SHARED CONFIGURATION - Applied to all environments
; ===============================================
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

lib_deps = 
    WiFiManager
    bblanchon/ArduinoJson@^6.21.5
    ESP32Async/AsyncTCP@^3.4.7
    ESP32Async/ESPAsyncWebServer@^3.8.0
    Update
    Ticker
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit BusIO@^1.17.2
    marian-craciunescu/ESP32Ping@^1.7.0
    arduino-libraries/NTPClient@^3.2.1
    SPI
    SD
    ArduinoOTA
    4-20ma/ModbusMaster@^2.0.1
    ; bodmer/TFT_eSPI@^2.5.43  ; Temporarily disabled

build_flags = 
    -D DEBUG_ESP_PORT=Serial
    -D CORE_DEBUG_LEVEL=1        ; Reduced from 3 to 1
    -Os                          ; Size optimization instead of -O0
    -ffunction-sections          ; Enable function sections
    -fdata-sections              ; Enable data sections
    
build_unflags = 
    -g                           ; Remove debug symbols
    -ggdb                        ; Remove debug symbols
    
board_build.ldflags = 
    -Wl,--gc-sections            ; Garbage collect unused sections

monitor_filters = 
    esp32_exception_decoder
    time

board_build.partitions = partitions_ota.csv

[env:usb]
; Default environment for USB upload (first-time flashing)

[env:ota]
; OTA environment for wireless updates
upload_protocol = espota
upload_port = 192.168.111.34
upload_flags = 
    --auth=Mar9aMulya
    --port=3232
    --timeout=60
    --debug

[env:ota-small]
; Production OTA environment with size optimization
upload_protocol = espota
upload_port = 192.168.111.34
upload_flags = 
    --auth=Mar9aMulya
    --port=3232
    --timeout=60
    --debug

; Override libraries to remove heavy ones
lib_deps = 
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    bblanchon/ArduinoJson@^6.21.3
    AsyncTCP
    ESPAsyncWebServer
    Update
    Ticker
    arduino-libraries/NTPClient@^3.2.1
    SPI
    ArduinoOTA
    ; Removed heavy libraries:
    ; adafruit/RTClib
    ; adafruit/Adafruit ADS1X15
    ; adafruit/Adafruit BusIO
    ; marian-craciunescu/ESP32Ping
    ; SD
    ; ModbusMaster

build_flags = 
    ${env.build_flags}           ; Inherit base flags
    -D CORE_DEBUG_LEVEL=0        ; No debug logging
    -D ARDUINOJSON_USE_LONG_LONG=0
    -D ARDUINOJSON_USE_DOUBLE=0
    -D WIFI_MANAGER_DEBUG=0
    -D DISABLE_MODBUS=1          ; Disable Modbus for size reduction
    -D DISABLE_ANALOG_SENSORS=1  ; Disable analog sensors
    -D DISABLE_RTC=1             ; Disable RTC
    -D DISABLE_SD=1              ; Disable SD card
    -DNDEBUG                     ; Disable assert statements
    
build_unflags = 
    -g                           ; Remove debug symbols
    -ggdb                        ; Remove debug symbols

