; PlatformIO Project Configuration File
;
; ESP8266 Universal Template by 0x3
; Easy to adapt for any ESP8266 board and project
;
; To use this template:
; 1. Change PROJECT_NAME, PROJECT_VERSION, PROJECT_AUTHOR in include/config.h
; 2. Update board type below if needed
; 3. Modify lib_deps if you need additional libraries
; 4. Update upload settings for your target board

; ===============================================
; BOARD CONFIGURATION - Change as needed
; ===============================================
; Supported boards:
; - d1_mini (Wemos D1 Mini)
; - d1_mini_pro (Wemos D1 Mini Pro) 
; - nodemcuv2 (NodeMCU v2)
; - esp12e (ESP-12E/ESP-12F)
; - esp01_1m (ESP-01 with 1MB)
; - esp07 (ESP-07)
; - esp32doit-devkit-v1 (ESP32 - requires platform change)

[env:d1_mini]
platform = espressif8266
board = d1_mini              ; Change this for different boards
framework = arduino
monitor_speed = 115200

; ===============================================
; ALTERNATIVE BOARD CONFIGURATIONS
; ===============================================
; Uncomment the section for your target board:

; [env:nodemcu]
; platform = espressif8266
; board = nodemcuv2
; framework = arduino
; monitor_speed = 115200

; [env:esp12e]
; platform = espressif8266
; board = esp12e
; framework = arduino
; monitor_speed = 115200

; [env:esp01]
; platform = espressif8266
; board = esp01_1m
; framework = arduino
; monitor_speed = 115200

; ===============================================
; LIBRARIES - Core dependencies for 0x3 template
; ===============================================
lib_deps = 
    tzapu/WiFiManager@^0.16.0      ; WiFi configuration management
    bblanchon/ArduinoJson@^6.21.3  ; JSON handling for API
    ESP8266WebServer               ; Built-in web server
    ESP8266HTTPUpdateServer        ; Built-in OTA updates
    ESP8266WiFi                    ; WiFi functionality
    ESP8266mDNS                    ; mDNS for service discovery
    Ticker                         ; System timing and callbacks

; ===============================================
; BUILD CONFIGURATION
; ===============================================
build_flags = 
    -D DEBUG_ESP_PORT=Serial       ; Enable serial debugging
    -D DEBUG_ESP_WIFI              ; Enable WiFi debugging
    ; Add custom flags here as needed
    ; -D MY_CUSTOM_FLAG=1

; ===============================================
; UPLOAD CONFIGURATION
; ===============================================
; USB upload (default - use for first upload)
upload_protocol = esptool
upload_speed = 921600

; OTA upload (uncomment after first USB upload and update IP)
; upload_protocol = espota
; upload_port = 192.168.1.100        ; Update with your ESP IP
; upload_flags = 
;     --auth=0x3Update               ; OTA password from config.h

; ===============================================
; MONITORING CONFIGURATION
; ===============================================
monitor_filters = 
    esp8266_exception_decoder      ; Decode crash stack traces
    time                           ; Add timestamps to output

; ===============================================
; DEBUGGING CONFIGURATION (optional)
; ===============================================
; debug_tool = esp-prog
; debug_init_break = tbreak setup
; debug_build_flags = -O0 -g -ggdb
